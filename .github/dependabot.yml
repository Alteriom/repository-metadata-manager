version: 2
updates:
    # Enable version updates for npm
    - package-ecosystem: 'npm'
      # Collapse routine updates into one PR per ecosystem; majors stay
      # individual so they can be reviewed on their own merits.
      groups:
          npm-minor-and-patch:
              applies-to: version-updates
              update-types:
                  - 'minor'
                  - 'patch'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
      open-pull-requests-limit: 10
      assignees:
          - 'Alteriom'
      commit-message:
          prefix: 'deps'
          include: 'scope'
      labels:
          - 'dependencies'
          - 'automated'

    # Enable version updates for GitHub Actions
    - package-ecosystem: 'github-actions'
      # Collapse routine updates into one PR per ecosystem; majors stay
      # individual so they can be reviewed on their own merits.
      groups:
          github-actions-minor-and-patch:
              applies-to: version-updates
              update-types:
                  - 'minor'
                  - 'patch'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
      open-pull-requests-limit: 5
      assignees:
          - 'Alteriom'
      commit-message:
          prefix: 'ci'
          include: 'scope'
      labels:
          - 'github-actions'
          - 'automated'
