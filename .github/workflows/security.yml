name: Security Scanning

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    schedule:
        # Run security scans daily at 2 AM UTC
        - cron: '0 2 * * *'
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
    actions: read

jobs:
    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Dependency Review
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: critical
                  allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC, BSD-2-Clause, Python-2.0, CC-BY-4.0, CC0-1.0, 0BSD, AGPL-3.0
                  # Version-scoped transitive exception for @modelcontextprotocol/sdk.
                  allow-dependencies-licenses: pkg:npm/json-schema-typed@8.0.2
              continue-on-error: false

    security-audit:
        name: Security Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run npm audit
              run: |
                  npm audit --json --audit-level moderate > security-audit.json
                  npm audit --audit-level moderate

            - name: Run security check
              run: node bin/repo-manager.js check --only security --format json

            - name: Check for security policy
              run: |
                  if [ -f "SECURITY.md" ]; then
                    echo "✅ Security policy found"
                  else
                    echo "⚠️ Security policy not found"
                  fi

            - name: Validate dependencies
              run: |
                  echo "Checking for known vulnerable packages..."
                  # Check for commonly vulnerable packages
                  if npm list --depth=0 | grep -E "(lodash@[0-3]\.|moment@[0-2]\.|jquery@[0-2]\.)"; then
                    echo "⚠️ Potentially vulnerable dependencies detected"
                  else
                    echo "✅ No obviously vulnerable dependencies found"
                  fi

            - name: Upload security audit results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: security-audit-results
                  path: |
                      security-audit.json
                  retention-days: 30

    secrets-scan:
        name: Secrets Scanning
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Run TruffleHog OSS
              uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
              with:
                  path: ./
                  extra_args: --debug --only-verified

    license-check:
        name: License Compliance
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check licenses
              run: node bin/repo-manager.js check --only license --format json

    security-summary:
        name: Security Summary
        runs-on: ubuntu-latest
        needs: [dependency-review, security-audit, secrets-scan, license-check]
        if: always()

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Security Summary
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
                  SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
                  SECRETS_SCAN_RESULT: ${{ needs.secrets-scan.result }}
                  LICENSE_CHECK_RESULT: ${{ needs.license-check.result }}
              run: |
                  echo "🔒 SECURITY SCAN SUMMARY"
                  echo "========================"
                  echo "Dependency Review: $DEPENDENCY_REVIEW_RESULT"
                  echo "Security Audit: $SECURITY_AUDIT_RESULT"
                  echo "Secrets Scan: $SECRETS_SCAN_RESULT"
                  echo "License Check: $LICENSE_CHECK_RESULT"
                  echo "CodeQL Analysis: Handled by GitHub default setup"
                  echo ""

                  test "$SECURITY_AUDIT_RESULT" = "success"
                  test "$SECRETS_SCAN_RESULT" = "success"
                  test "$LICENSE_CHECK_RESULT" = "success"
                  if [[ "$EVENT_NAME" == "pull_request" ]]; then
                    test "$DEPENDENCY_REVIEW_RESULT" = "success"
                  fi
                  echo "✅ All required security jobs passed"
