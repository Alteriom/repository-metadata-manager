name: AI Agent Compliance Check

on:
    # pull_request_target loads this workflow from the protected base branch. The
    # candidate merge tree is evaluated as data by the privileged job. Candidate
    # code executes only in the separate secret-free test job.
    pull_request_target:
        branches: [main, develop]
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches: [main, develop]
    schedule:
        - cron: '0 2 * * *'
    repository_dispatch:
        types: [repository-compliance]

permissions:
    contents: read
    checks: write
    pull-requests: write
    issues: write
    actions: read

jobs:
    resolve-candidate:
        name: Resolve Immutable Candidate
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            archive-sha: ${{ steps.candidate.outputs.archive-sha }}
            report-sha: ${{ steps.candidate.outputs.report-sha }}
            check-sha: ${{ steps.candidate.outputs.check-sha }}

        steps:
            - name: Resolve candidate identity once
              id: candidate
              uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
              env:
                  DISPATCH_PR_NUMBER: ${{ github.event.client_payload.pull_request_number }}
              with:
                  script: |
                      let archiveSha = context.sha;
                      let reportSha = context.sha;
                      let checkSha = context.sha;

                      if (context.eventName === 'pull_request_target') {
                        archiveSha = context.payload.pull_request.merge_commit_sha;
                        reportSha = context.payload.pull_request.merge_commit_sha;
                        checkSha = context.payload.pull_request.head.sha;
                      } else if (context.eventName === 'repository_dispatch') {
                        const pullNumber = Number(process.env.DISPATCH_PR_NUMBER);
                        if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
                          core.setFailed('repository-compliance requires a positive pull_request_number');
                          return;
                        }
                        const { data: pull } = await github.rest.pulls.get({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: pullNumber,
                        });
                        if (pull.state !== 'open' || !pull.merge_commit_sha) {
                          core.setFailed(`Pull request #${pullNumber} is not open and mergeable`);
                          return;
                        }
                        archiveSha = pull.merge_commit_sha;
                        reportSha = pull.merge_commit_sha;
                        checkSha = pull.head.sha;
                      }

                      core.setOutput('archive-sha', archiveSha);
                      core.setOutput('report-sha', reportSha);
                      core.setOutput('check-sha', checkSha);

    trusted-candidate-tests:
        name: Trusted Candidate Test Sandbox
        needs: resolve-candidate
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read

        steps:
            - name: Checkout trusted test control plane
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
                  path: control
                  persist-credentials: false

            - name: Download candidate test repository
              uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
              env:
                  CANDIDATE_REF: ${{ needs.resolve-candidate.outputs.archive-sha }}
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');
                      const response = await github.rest.repos.downloadTarballArchive({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: process.env.CANDIDATE_REF,
                      });
                      fs.writeFileSync(
                        path.join(process.env.RUNNER_TEMP, 'test-candidate.tar.gz'),
                        Buffer.from(response.data)
                      );

            - name: Extract candidate test repository
              shell: bash
              run: |
                  mkdir candidate
                  tar \
                    --extract \
                    --gzip \
                    --file "$RUNNER_TEMP/test-candidate.tar.gz" \
                    --directory candidate \
                    --strip-components 1 \
                    --no-same-owner \
                    --no-same-permissions
                  find candidate -type l -delete

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: '24.x'

            - name: Install trusted test tooling
              working-directory: control
              run: npm ci --ignore-scripts

            - name: Install candidate dependencies without lifecycle scripts
              working-directory: candidate
              env:
                  NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/trusted-empty-npmrc
              run: |
                  touch "$NPM_CONFIG_USERCONFIG"
                  npm ci --ignore-scripts --registry=https://registry.npmjs.org

            - name: Replace candidate tests with protected tests
              shell: bash
              run: |
                  rm -rf candidate/test
                  cp -R control/test candidate/test
                  mkdir -p "$RUNNER_TEMP/trusted-test-home"

            - name: Run protected lint configuration on candidate
              working-directory: candidate
              shell: bash
              run: |
                  env -i \
                    CI=true \
                    HOME="$RUNNER_TEMP/trusted-test-home" \
                    PATH="$PATH" \
                    node "$GITHUB_WORKSPACE/control/node_modules/eslint/bin/eslint.js" \
                      --config "$GITHUB_WORKSPACE/control/eslint.config.js" \
                      .

            - name: Run protected tests against candidate
              working-directory: candidate
              shell: bash
              run: |
                  sudo env -i \
                    CI=true \
                    HOME="$RUNNER_TEMP/trusted-test-home" \
                    PATH="$PATH" \
                    REPO_MANAGER_TRUSTED_TEST_ISOLATION=required \
                    node "$GITHUB_WORKSPACE/control/scripts/run-trusted-tests.js" \
                      "$GITHUB_WORKSPACE/candidate"

    compliance-check:
        name: Compliance Control Plane
        needs: [resolve-candidate, trusted-candidate-tests]
        if: always() && needs.resolve-candidate.result == 'success'
        runs-on: ubuntu-latest
        env:
            AUTHENTICATED_CONTEXT: ${{ github.actor != 'dependabot[bot]' && secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
            LOCAL_ONLY_CHECKERS: cicd,dependencies,documentation,iot,license,security

        steps:
            - name: Checkout trusted control plane
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
                  path: control
                  persist-credentials: false

            - name: Download candidate repository as data
              uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
              env:
                  CANDIDATE_REF: ${{ needs.resolve-candidate.outputs.archive-sha }}
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');
                      const response = await github.rest.repos.downloadTarballArchive({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: process.env.CANDIDATE_REF,
                      });
                      fs.writeFileSync(
                        path.join(process.env.RUNNER_TEMP, 'candidate.tar.gz'),
                        Buffer.from(response.data)
                      );

            - name: Extract candidate repository without executing it
              shell: bash
              env:
                  CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.report-sha }}
              run: |
                  mkdir candidate
                  tar \
                    --extract \
                    --gzip \
                    --file "$RUNNER_TEMP/candidate.tar.gz" \
                    --directory candidate \
                    --strip-components 1 \
                    --no-same-owner \
                    --no-same-permissions
                  find candidate -type l -delete
                  git -C candidate init --quiet
                  git -C candidate remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
                  mkdir -p candidate/.git/refs/heads
                  printf '%s\n' "$CANDIDATE_SHA" > candidate/.git/refs/heads/candidate
                  git -C candidate symbolic-ref HEAD refs/heads/candidate
                  test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: '24.x'
                  cache: 'npm'
                  cache-dependency-path: control/package-lock.json

            - name: Install trusted evaluator dependencies
              working-directory: control
              run: npm ci --ignore-scripts

            - name: Stage trusted policy inside candidate worktree
              shell: bash
              env:
                  APP_ID: ${{ secrets.APP_ID }}
              run: |
                  if [[ "$AUTHENTICATED_CONTEXT" == "true" ]]; then
                    jq --argjson app_id "$APP_ID" \
                      '.branchProtection.requiredStatusCheckAppIds["Compliance Check"] = $app_id |
                       .branchProtection.requiredStatusCheckAppIds["Trusted Test & Lint"] = $app_id' \
                      control/.repo-manager.json > candidate/.git/repo-manager-policy.json
                  else
                    cp control/.repo-manager.json candidate/.git/repo-manager-policy.json
                  fi

            - name: Normalize GitHub App private key
              if: env.AUTHENTICATED_CONTEXT == 'true'
              id: private-key
              shell: bash
              env:
                  APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  if [[ "$APP_PRIVATE_KEY" == \{* ]]; then
                    key="$(printf '%s' "$APP_PRIVATE_KEY" | jq -er '.privateKey // .private_key // .pem')"
                  elif [[ "$APP_PRIVATE_KEY" == \"* ]]; then
                    key="$(printf '%s' "$APP_PRIVATE_KEY" | jq -er '.')"
                  else
                    key="$APP_PRIVATE_KEY"
                  fi
                  key="${key//%0A/$'\n'}"
                  key="${key//%0a/$'\n'}"
                  if [[ "$key" != *"BEGIN "* ]]; then
                    encoded="$(printf '%s' "$key" | tr -d '[:space:]' | tr '_-' '/+')"
                    case $((${#encoded} % 4)) in
                      2) encoded="${encoded}==" ;;
                      3) encoded="${encoded}=" ;;
                      1) echo "APP_PRIVATE_KEY is not valid PEM or base64" >&2; exit 1 ;;
                    esac
                    if ! key="$(printf '%s' "$encoded" | base64 --decode 2>/dev/null)"; then
                      echo "APP_PRIVATE_KEY is not valid PEM or base64" >&2
                      exit 1
                    fi
                  fi
                  if [[ "$key" != *"-----BEGIN "*"PRIVATE KEY-----"* ]]; then
                    echo "APP_PRIVATE_KEY does not contain a private-key PEM block" >&2
                    exit 1
                  fi
                  private_key="$(printf '%s\n' "$key" | awk 'BEGIN { ORS="\\n" } { print }' | head -c -2)"
                  echo "::add-mask::$private_key"
                  echo "private-key=$private_key" >> "$GITHUB_OUTPUT"

            - name: Create repository compliance token
              if: env.AUTHENTICATED_CONTEXT == 'true'
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ steps.private-key.outputs.private-key }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-administration: write
                  permission-checks: write
                  permission-contents: read

            - name: Run compliance check
              id: check
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  ARGS=()
                  if [[ "$AUTHENTICATED_CONTEXT" != "true" ]]; then
                    ARGS+=(--only "$LOCAL_ONLY_CHECKERS")
                    echo "Restricted actor: running secret-free local compliance scope"
                  fi
                  node control/bin/repo-manager.js check \
                    "${ARGS[@]}" \
                    --project candidate \
                    --policy .git/repo-manager-policy.json \
                    --format json \
                    --output compliance-report.json
                  SCORE=$(jq -r '.score' compliance-report.json)
                  GRADE=$(jq -r '.grade' compliance-report.json)
                  echo "score=$SCORE" >> "$GITHUB_OUTPUT"
                  echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
                  echo "Repository health: $SCORE/100 ($GRADE)"
              continue-on-error: true

            - name: Run with GitHub annotations
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  ARGS=()
                  if [[ "$AUTHENTICATED_CONTEXT" != "true" ]]; then
                    ARGS+=(--only "$LOCAL_ONLY_CHECKERS")
                  fi
                  node control/bin/repo-manager.js check \
                    "${ARGS[@]}" \
                    --project candidate \
                    --policy .git/repo-manager-policy.json \
                    --format github
              continue-on-error: true

            - name: Publish candidate compliance check
              if: always() && env.AUTHENTICATED_CONTEXT == 'true' && steps.app-token.outcome == 'success'
              uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
              env:
                  CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.check-sha }}
                  CHECK_CONCLUSION: ${{ steps.check.outcome == 'success' && 'success' || 'failure' }}
                  DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const fs = require('fs');
                      let report = { score: 0, grade: 'F', status: 'fail' };
                      try {
                        report = JSON.parse(fs.readFileSync('compliance-report.json', 'utf8'));
                      } catch { /* the failed control-plane run is reported below */ }

                      await github.rest.checks.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        name: 'Compliance Check',
                        head_sha: process.env.CANDIDATE_SHA,
                        status: 'completed',
                        conclusion: process.env.CHECK_CONCLUSION,
                        details_url: process.env.DETAILS_URL,
                        output: {
                          title: `Repository compliance: ${report.status}`,
                          summary: `Score: ${report.score}/100 (${report.grade})`,
                        },
                      });

            - name: Publish trusted candidate test check
              if: always() && env.AUTHENTICATED_CONTEXT == 'true' && steps.app-token.outcome == 'success'
              uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
              env:
                  CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.check-sha }}
                  CHECK_CONCLUSION: ${{ needs.trusted-candidate-tests.result == 'success' && 'success' || 'failure' }}
                  DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      await github.rest.checks.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        name: 'Trusted Test & Lint',
                        head_sha: process.env.CANDIDATE_SHA,
                        status: 'completed',
                        conclusion: process.env.CHECK_CONCLUSION,
                        details_url: process.env.DETAILS_URL,
                        output: {
                          title: `Protected candidate tests: ${process.env.CHECK_CONCLUSION}`,
                          summary: 'Candidate code was tested with the protected branch workflow, tests, lint configuration, and Node.js 24.',
                        },
                      });

            - name: Publish restricted candidate compliance check
              if: always() && env.AUTHENTICATED_CONTEXT != 'true'
              uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
              env:
                  CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.check-sha }}
                  CHECK_CONCLUSION: ${{ steps.check.outcome == 'success' && 'success' || 'failure' }}
                  DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      let report = { score: 0, grade: 'F', status: 'fail' };
                      try {
                        report = JSON.parse(fs.readFileSync('compliance-report.json', 'utf8'));
                      } catch { /* the failed restricted run is reported below */ }

                      await github.rest.checks.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        name: 'Compliance Check (restricted)',
                        head_sha: process.env.CANDIDATE_SHA,
                        status: 'completed',
                        conclusion: process.env.CHECK_CONCLUSION,
                        details_url: process.env.DETAILS_URL,
                        output: {
                          title: `Restricted repository compliance: ${report.status}`,
                          summary: `Local-only score: ${report.score}/100 (${report.grade})`,
                        },
                      });

            - name: Comment on PR with results
              if: github.event_name == 'pull_request_target' && env.AUTHENTICATED_CONTEXT == 'true'
              uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      let report;
                      try {
                        report = JSON.parse(fs.readFileSync('compliance-report.json', 'utf8'));
                      } catch {
                        report = { score: 0, grade: 'F', summary: { total_findings: 0 } };
                      }

                      const summary = [
                        '## Repository Health Check',
                        '',
                        `**Score: ${report.score}/100 (${report.grade})**`,
                        '',
                        `Findings: ${report.summary?.total_findings || 0} total`,
                        '',
                        '<details>',
                        '<summary>Full Report</summary>',
                        '',
                        '```json',
                        JSON.stringify(report, null, 2).substring(0, 60000),
                        '```',
                        '',
                        '</details>',
                        '',
                        '---',
                        '*Automated by repository-metadata-manager*',
                      ].join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const botComment = comments.find(c =>
                        c.user.type === 'Bot' && c.body.includes('Repository Health Check')
                      );

                      if (botComment) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: botComment.id,
                          body: summary,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: summary,
                        });
                      }

            - name: Upload report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: compliance-report
                  path: compliance-report.json
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Enforce compliance result
              if: steps.check.outcome != 'success' || needs.trusted-candidate-tests.result != 'success'
              run: exit 1
