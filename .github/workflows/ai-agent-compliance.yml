name: AI Agent Compliance Check

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]
    schedule:
        - cron: '0 2 * * *'
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write
    issues: write
    actions: read

jobs:
    compliance-check:
        name: Compliance Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Normalize GitHub App private key
              id: private-key
              shell: bash
              env:
                  APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  key="$APP_PRIVATE_KEY"
                  if [[ "$key" != *"BEGIN "* ]]; then
                    key="$(printf '%s' "$key" | base64 --decode)"
                  fi
                  private_key="$(printf '%s\n' "$key" | awk 'BEGIN { ORS="\\n" } { print }' | head -c -2)"
                  echo "::add-mask::$private_key"
                  echo "private-key=$private_key" >> "$GITHUB_OUTPUT"

            - name: Create repository compliance token
              id: app-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ steps.private-key.outputs.private-key }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-administration: read
                  permission-contents: read

            - name: Run compliance check
              id: check
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  node bin/repo-manager.js check --format json > compliance-report.json
                  SCORE=$(jq -r '.score' compliance-report.json)
                  GRADE=$(jq -r '.grade' compliance-report.json)
                  echo "score=$SCORE" >> $GITHUB_OUTPUT
                  echo "grade=$GRADE" >> $GITHUB_OUTPUT
                  echo "Repository health: $SCORE/100 ($GRADE)"
              continue-on-error: true

            - name: Run with GitHub annotations
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: node bin/repo-manager.js check --format github
              continue-on-error: true

            - name: Comment on PR with results
              if: github.event_name == 'pull_request'
              uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      let report;
                      try {
                        report = JSON.parse(fs.readFileSync('compliance-report.json', 'utf8'));
                      } catch {
                        report = { score: 0, grade: 'F', summary: { total_findings: 0 } };
                      }

                      const summary = [
                        '## Repository Health Check',
                        '',
                        `**Score: ${report.score}/100 (${report.grade})**`,
                        '',
                        `Findings: ${report.summary?.total_findings || 0} total`,
                        '',
                        '<details>',
                        '<summary>Full Report</summary>',
                        '',
                        '```json',
                        JSON.stringify(report, null, 2).substring(0, 60000),
                        '```',
                        '',
                        '</details>',
                        '',
                        '---',
                        '*Automated by repository-metadata-manager*',
                      ].join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const botComment = comments.find(c =>
                        c.user.type === 'Bot' && c.body.includes('Repository Health Check')
                      );

                      if (botComment) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: botComment.id,
                          body: summary,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: summary,
                        });
                      }

            - name: Upload report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: compliance-report
                  path: compliance-report.json
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Enforce compliance result
              if: steps.check.outcome != 'success'
              run: exit 1
